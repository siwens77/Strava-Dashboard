name: Sync Strava Data

on:
  push:                
    branches: [main]   
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Scraper
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scrapper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'StravaBot'
          git config --global user.email 'bot@strava.com'
          git add activities.csv
          git commit -m "Auto-update Strava activities" || exit 0
          git push

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("shiny", "shinydashboard", "plotly", "DT", "dplyr", "lubridate", "fontawesome", "httr", "jsonlite", "stringr", "rsconnect"))'

      - name: Deploy to shinyapps.io
        env:
          env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          PCSS_API_KEY: ${{ secrets.PCSS_API_KEY }}
          
          PCSS_BASE_URL: "https://llm.hpc.psnc.pl/v1"
          PCSS_MODEL: "bielik_11b"
          R_PORT: "3838"
        run: |
          echo "STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}" > .Renviron
          echo "STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}" >> .Renviron
          echo "STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN}" >> .Renviron
          echo "PCSS_API_KEY=${PCSS_API_KEY}" >> .Renviron
          echo "PCSS_BASE_URL=${PCSS_BASE_URL}" >> .Renviron
          echo "PCSS_MODEL=${PCSS_MODEL}" >> .Renviron
          echo "R_PORT=${R_PORT}" >> .Renviron
          
          Rscript -e "rsconnect::setAccountInfo(name=Sys.getenv('SHINYAPPS_ACCOUNT'), token=Sys.getenv('SHINYAPPS_TOKEN'), secret=Sys.getenv('SHINYAPPS_SECRET'))"
          Rscript -e "rsconnect::deployApp(appDir = '.', forceUpdate = TRUE)"
          
